function tone(type=0){if(!sound)return;try{ctx ||= new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=type===0?'sine':type===1?'triangle':'square';o.frequency.setValueAtTime([150,900,330][type],t);if(type===0)o.frequency.exponentialRampToValueAtTime(45,t+.17);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)}catch(e){}}

function openGame(i){stop();id=i;round=0;ruleFlip=false;$('#homeBtn').hidden=false;render()}
function levelText(){return [['2 инструмента · 3–4 удара','3 инструмента · 4–5 ударов','3 инструмента · 5–6 ударов с паузами'],['Первое правило · 6 сигналов','Смена правила · 6 сигналов медленно','Новое правило по памяти · 8 сигналов'],['Повторяй ту же сторону','Работай как зеркало: меняй сторону','Чередуй «повтори» и «зеркало»'],['Запомни 2 движения','Запомни 3 движения','Запомни 4 движения'],['Одно движение','Цепочка из 2 движений','Цепочка из 3 движений'],['⭐ — хлопок. Остальные — ничего.','⭐ — хлопок; ☁️ — прыжок. Остальные — ничего.','⭐ — хлопок; ☁️ — прыжок; ☀️ — руки вверх. Остальные — ничего.']][id][level-1]}
function render(){let g=games[id];$('#app').innerHTML=`<section class="panel"><div class="top"><div><h2>${g.name}</h2><div>${g.desc}</div></div><div class="hero">${hero(g.animal)}</div></div><div class="levels" aria-label="Уровень сложности">${[1,2,3].map(n=>`<button class="${level===n?'active':''}" onclick="choose(${n})">Уровень ${n}</button>`).join('')}</div><p class="hint">${g.rule}</p><p><strong>${levelText()}</strong></p><div class="settings"><label>Темп <select id="speed"><option value="1300">Спокойный</option><option value="900">Средний</option><option value="650">Быстрый</option></select></label><label><input id="voice" type="checkbox" ${voice?'checked':''} onchange="voice=this.checked"> Озвучивать команды</label></div>${id===1?'<div class="settings"><label>Режим <select id="trafficMode"><option value="auto">Автоматический</option><option value="manual">С педагогом</option></select></label><label><input type="checkbox" id="trafficHints"> Подсказки в финале</label></div>':''}<div class="progress"><i id="bar" style="width:0%"></i></div><div id="status" class="status" aria-live="polite">Можно начать с любого уровня</div><div class="stage" id="stage"><div class="big">${['🥁','🚦','🤖','🐾','🙃','⭐'][id]}</div><div class="cue">Готовы играть?</div><p>Нажми «Начать» — сначала покажем задание.</p></div><div class="controls" id="controls"><button onclick="start()">▶ Начать</button></div><p class="note">${id===1?'Сигналы идут серией. На втором уровне зелёный и жёлтый меняются командами; красный всегда — замри.':id===5?'Серия идёт автоматически. Прыжок можно заменить подъёмом на носки или движением рук сидя.':'Оценка после движения: ребёнок или взрослый нажимает «Получилось» либо «Повторить».'} В ритме сначала звучит образец, затем ребёнок повторяет его движениями. При необходимости сделайте паузу; выполняйте движения в удобной амплитуде, ${id===5?'прыжки выполняйте мягко на свободном месте.':'без прыжков.'}</p></section>`}
function choose(n){stop();level=n;round=0;ruleFlip=false;render()}
function buttons(html){$('#controls').innerHTML=html}function stage(html){$('#stage').classList.toggle('signal-paused',false);$('#stage').style.opacity=1;$('#stage').innerHTML=html}function delay(ms,t){return new Promise(r=>{let end=Date.now()+ms;function tick(){if(t!==token)return r(false);if(paused){end+=60;setTimeout(tick,60)}else if(Date.now()>=end)r(true);else setTimeout(tick,Math.min(60,end-Date.now()))}tick()})}
function start(){stop();round=0;ruleFlip=false;total=id===5?20:id===1?[6,6,8][level-1]:6;if(id===1){trafficIntro();return}if(id===5){runSignals();return}next()}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}let pattern=[];let speed=1300;
async function next(replay=false){const t=++token;phase='show';paused=false;speed=Number($('#speed').value);$('#speed').disabled=true;$('#status').textContent=`Задание ${round+1} из ${total}`;$('#bar').style.width=round/total*100+'%';buttons('<button class="secondary" onclick="pause()" id="pause">Ⅱ Пауза</button>');
if(id===0){if(!replay){pattern=Array.from({length:level+2+round%2},()=>Math.floor(Math.random()*(level===1?2:3)));if(level===3)pattern.splice(2,0,-1)}stage('<div class="big">👂</div><div class="cue">Слушай и смотри</div>');if(!await delay(900,t))return;for(let k of pattern){stage(`<div class="big">${['🥁','🔔','🪇'][k]||'🤫'}</div><div class="cue">${['Барабан','Колокольчик','Шейкер'][k]||'Пауза'}</div>`);if(k>=0)tone(k);if(!await delay(speed,t))return;}stage('<div class="big">👏</div><div class="cue">Теперь повтори ритм!</div><p>Выполни движения в том же порядке. В паузе — тишина.</p>');}

if(id===2){if(!replay)last=rnd([0,1,2,3]);let mirror=level===2||(level===3&&round%2===1);let rule=mirror?'ЗЕРКАЛО — МЕНЯЙ СТОРОНУ':'ПОВТОРИ ТУ ЖЕ СТОРОНУ';let explanation=mirror?'Двигайся как отражение робота в зеркале.':'Повторяй: левая сторона робота — твоя левая, правая — твоя правая.';stage(`<div class="robot-rule">${mirror?'🪞':'🤝'} ${rule}<small>${explanation}</small></div><div id="robotMotion">${robotPose(-1)}</div>`);say(mirror?'Зеркало. Меняй сторону.':'Повтори ту же сторону.');if(!await delay(speed,t))return;$('#robotMotion').innerHTML=robotPose(last);if(!await delay(speed*1.5,t))return;}

if(id===3){let moves=['👏 Хлопни','🙆 Руки вверх','🤲 Руки вперёд','🚶 Два шага на месте','✋ Коснись плеч'];if(!replay){pattern=[];for(let k=0;k<level+1;k++)pattern.push(rnd(moves.filter(x=>k===0||x!==pattern[k-1])));}stage('<div class="cue">Запоминай цепочку</div><div class="actions">'+pattern.map((x,i)=>`<span>${i+1}. ${x}</span>`).join('')+'</div>');if(!await delay(speed*(level+2),t))return;stage('<div class="big">🐾</div><div class="cue">Повтори по памяти!</div><p>Сначала первое движение, затем остальные.</p>');}
if(id===4){let commands=['Руки вверх','Руки вниз','Руки в стороны','Руки к плечам'];if(!replay){pattern=[];for(let k=0;k<level;k++){let choices=[0,1,2,3].filter(x=>k===0||x!==pattern[k-1]);pattern.push(rnd(choices));}}stage('<div class="robot-rule">🙃 ДЕЛАЙ НАОБОРОТ<small>Сначала посмотри всю цепочку. Потом выполни противоположные движения по порядку.</small></div><div class="cue">Приготовься смотреть</div>');if(!await delay(speed,t))return;for(let k=0;k<pattern.length;k++){stage(`<div class="robot-rule">🙃 ДЕЛАЙ НАОБОРОТ</div><p class="status">Движение ${k+1} из ${pattern.length}</p><div class="cue">${commands[pattern[k]]}</div>`);say(commands[pattern[k]]);if(!await delay(Math.max(speed*1.7,voice&&sound?2300:0),t))return;if(k<pattern.length-1){stage('<div class="robot-rule">🙃 ДЕЛАЙ НАОБОРОТ</div><div class="big">• • •</div>');if(!await delay(400,t))return;}}stage(`<div class="robot-rule">🙃 ТЕПЕРЬ НАОБОРОТ!</div><div class="big">${'● '.repeat(level)}</div><div class="cue">Твой ход!</div><p class="hint">${level===1?'Выполни противоположное движение.':`Выполни ${level} противоположных движения в том же порядке.`}</p>`);say('Твой ход. Выполни наоборот.');}


if(t!==token)return;phase='answer';buttons('<button onclick="success()">✓ Получилось!</button><button class="secondary" onclick="next(true)">↻ Повторить</button>');}
let trafficStep=0,trafficSequence=[];
function trafficRule(swapped){return `<div class="signal-rules"><span>🟢 ${swapped?'Хлопай':'Шагай на месте'}</span><span>🟡 ${swapped?'Шагай на месте':'Хлопай'}</span><span>🔴 Замри</span></div>`}
function trafficIntro(){phase='between';stage(`<div class="robot-rule">${level===1?'🚦 ПЕРВОЕ ПРАВИЛО':'🔄 НОВОЕ ПРАВИЛО'}</div>${trafficRule(false)}${level>1?'<p class="hint">Теперь зелёный и жёлтый меняются командами!</p>'+trafficRule(true):''}<p class="hint">${level===3?'В финале действуй по памяти. Красный всегда — замри.':'Посмотри правила и приготовься.'}</p>`);buttons('<button onclick="runTraffic()">Правило понятно — начать →</button>')}
async function runTraffic(){const t=++token;phase='show';paused=false;trafficStep=0;total=[6,6,8][level-1];speed=Number($('#speed').value);$('#speed').disabled=true;let manual=$('#trafficMode').value==='manual',hints=level<3||$('#trafficHints').checked;$('#trafficMode').disabled=true;trafficSequence=level===1?[2,1,0,1,2,0]:level===2?[1,2,0,2,1,0]:[2,1,0,2,1,0,rnd([0,1,2]),rnd([0,1,2])];if(level===3)for(let i=trafficSequence.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[trafficSequence[i],trafficSequence[j]]=[trafficSequence[j],trafficSequence[i]]}for(let i=0;i<total;i++){round=i;let c=trafficSequence[i];$('#status').textContent=`Сигнал ${i+1} из ${total}`;$('#bar').style.width=i/total*100+'%';let cols=['#ff5757','#ffd341','#54db8a'];stage(`${hints?trafficRule(level>1):'<div class="robot-rule">ВЫПОЛНЯЙ ПО НОВОМУ ПРАВИЛУ</div>'}<div class="traffic traffic-vertical">${cols.map((v,k)=>`<div class="lamp ${k===c?'on':''}" style="--light:${v}"></div>`).join('')}</div><div class="cue">${['Красный','Жёлтый','Зелёный'][c]}</div>`);tone(1);buttons('<button class="secondary" onclick="pause()" id="pause">Ⅱ Пауза</button>'+(manual?`<button onclick="if(!paused)trafficStep++">${i===total-1?'Завершить серию':'Следующий сигнал →'}</button>`:''));if(manual){while(trafficStep<=i){if(!await delay(60,t))return;}}else{let duration=level===1?5000:level===2?6000:Math.round(speed*3.85);if(!await delay(duration,t))return;}$('#bar').style.width=(i+1)/total*100+'%';stage('<div class="big">🚦</div><div class="cue">Приготовься</div>');if(!await delay(650,t))return;}round=total;finish();}
let signalSeries=[];
function signalRules(){return '<div class="signal-rules"><span>⭐ Хлопок</span>'+(level>=2?'<span>☁️ Прыжок</span>':'')+(level===3?'<span>☀️ Руки вверх</span>':'')+'</div><p class="signal-rest">На остальные знаки — ничего не делай.</p>'}
async function runSignals(){const t=++token;phase='show';paused=false;total=20;speed=Number($('#speed').value);$('#speed').disabled=true;signalSeries=Array.from({length:20},(_,i)=>['⭐','☁️','☀️','🌙','🌸'][i%5]);for(let i=19;i>0;i--){let j=Math.floor(Math.random()*(i+1));[signalSeries[i],signalSeries[j]]=[signalSeries[j],signalSeries[i]]}buttons('<button class="secondary" onclick="pause()" id="pause">Ⅱ Пауза</button>');stage(signalRules()+'<div class="cue">Приготовься!</div><p>Сейчас знаки поплывут по одному.</p>');$('#status').textContent='Серия из 20 знаков';if(!await delay(2200,t))return;for(let i=0;i<20;i++){round=i;$('#status').textContent=`Знак ${i+1} из 20`;$('#bar').style.width=i/20*100+'%';stage(signalRules()+`<div class="signal-window"><div class="floating-sign" style="--travel:${speed*2}ms" role="img" aria-label="${{'⭐':'Звезда','☁️':'Облако','☀️':'Солнце','🌙':'Луна','🌸':'Цветок'}[signalSeries[i]]}">${signalSeries[i]}</div></div>`);if(!await delay(speed*2,t))return;stage(signalRules()+'<div class="signal-window"></div>');$('#bar').style.width=(i+1)/20*100+'%';if(!await delay(350,t))return;}round=20;finish();}
function pause(){paused=!paused;$('#pause').textContent=paused?'▶ Продолжить':'Ⅱ Пауза';$('#stage').style.opacity=paused?.35:1;$('#stage').classList.toggle('signal-paused',paused)}
function success(){if(phase!=='answer')return;token++;round++;tone(1);if(round>=total){finish();return}phase='between';stage(`<div class="hero bounce">${hero(games[id].animal,true)}</div><div class="cue">${rnd(praises)}</div>`);$('#bar').style.width=round/total*100+'%';buttons('<button onclick="next()">Дальше →</button>')}
function finish(){phase='done';$('#bar').style.width='100%';$('#status').textContent=`Уровень ${level} пройден!`;stage(`<div class="hero bounce">${hero(games[id].animal,true)}</div><div class="cue">Ура! Ты справился! 🎉</div><p class="hint">${id===1?'Все '+total+' сигналов пройдены.':id===5?'Все 20 знаков пройдены.':'Все '+total+' заданий выполнены.'} ${games[id].name} — отличная работа!</p>`);buttons(`${level<3?'<button onclick="choose(level+1)">Следующий уровень →</button>':''}<button onclick="start()">Ещё раз</button><button class="secondary" onclick="home()">Выбрать игру</button>`);say('Ура! Ты справился!');for(let i=0;i<65;i++){let e=document.createElement('span');e.className='confetti';e.textContent=rnd(['⭐','🎉','🟡','💜','🟢']);e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.append(e);setTimeout(()=>e.remove(),4000)}}
$('#homeBtn').onclick=home;$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'♪ Звук вкл.':'♪ Звук выкл.';$('#soundBtn').setAttribute('aria-pressed',sound);if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='show'&&!paused&&$('#pause'))pause()});home();
</script></html>
